# TrueMemoryRecall (TMR) Plugin Configuration

# Storage settings
storage:
  raw_dir: "~/.openclaw/workspace/memory/raw"
  graph_dir: "~/.openclaw/workspace/memory/graph"
  
# Qdrant connection (reuse existing)
qdrant:
  host: "localhost"
  port: 6333
  collections:
    conversations: "tmr_conversations"
    line_index: "tmr_line_index"
    knowledge_graph: "tmr_knowledge_graph"

# Filter settings
filter:
  min_length: 10
  drop_patterns:
    - "^hi$"
    - "^ok$"
    - "^yes$"
    - "^no$"
    - "^hm$"
    - "^hmm$"
    - "^hello$"
    - "^hey$"
    - "^yo$"
    - "^wait$"
    - "^umm?$"
    - "^like$"
    - "^so$"
    - "^btw$"

# Daily extraction settings
extraction:
  enabled: true
  model: "google/gemini-2.0-flash-lite-001"
  time: "03:00"
  timezone: "Asia/Kolkata"
  # API key for Gemini extraction (uses environment OPENROUTER_API_KEY if not set)
  api_key: "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"

# Auto-inject settings
injection:
  enabled: true
  max_relations: 5
  min_strength: 0.5
